<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Agora - Posts</title>
	<link href="styles.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com" rel="preconnect">
	<link href="https://fonts.gstatic.com" rel="preconnect">
	<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
</head>
<body>
	<div class="container">
		<header>
			<div class="headerWrapper">
				<h1>Agora</h1>
				<nav>
					<a href="index.html">Home</a> <a class="active" href="posts.html">Posts</a> <a href="contact.html">Contact</a>
				</nav>
			</div>
		</header>
		<aside id="asideRight"></aside>
		<main>
			<section class="section1">
				<h1>Posts</h1>
				<div class="wrapper-posts">

          <!-- Container with all posts: -->
					<div id="postsContainer"></div>

          <!-- Modal that opens when a username is clicked: -->
					<div class="modal" id="userModal">
						<div class="modal-content">
							<span class="close" id="closeModal">&times;</span>
							<h3 id="modalUsername"></h3>
							<p id="modalName"></p>
							<p id="modalAge"></p>
							<p id="modalEmail"></p>
							<p id="modalPhone"></p>
						</div>
					</div>

          <!-- Pagination section: -->
					<div class="pagination" id="pagination">
						<a href="#" id="prev">◀</a> <a class="page-link" data-page="1" href="#">1</a> <a class="page-link" data-page="2" href="#">2</a> <a class="page-link" data-page="3" href="#">3</a> <a href="#" id="next">▶</a>
						<p id="page-numbers"></p>
					</div>
				</div>
			</section>
      
			<section class="section3">
				<h3>Follow us!</h3>
				<div class="logoWrapper"><img alt="Instagram" src="assets/igLogo.svg"> <img alt="Facebook" src="assets/fbLogo.svg"> <img alt="LinkedIn" src="assets/linkedinLogo.svg"></div>
			</section>
		</main>
		<aside id="asideLeft"></aside>
		<footer>
			&copy; 2025 Agora
		</footer>
	</div>
	<script src="./js/posts.js" type="module">
	</script> 
</body>
</html>
