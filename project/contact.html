<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Agora - Contact</title>
	<link href="styles.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com" rel="preconnect">
	<link href="https://fonts.gstatic.com" rel="preconnect">
	<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
</head>
<body>
	<div class="container">
		<header>
			<div class="headerWrapper">
				<h1>Agora</h1>
				<nav>
					<a href="index.html">Home</a> <a href="posts.html">Posts</a> <a class="active" href="contact.html">Contact</a>
				</nav>
			</div>
		</header>
		<aside id="asideRight"></aside>
		<main>
			<section>
				<div class="formContainer">
					<h3>Contact us</h3>
					<form id="myForm" method="get" name="myForm">
						<div class="nameEmailWrapper">
							<label for="name">Name: <input id="name" name="name" placeholder="John Doe" type="text"></label>
              <!-- Missing name error will be shown here: -->
							<div id="missingName"></div>

              <label for="email">Email: <input id="email" name="email" placeholder="john.doe@gmail.com" type="email"></label>
              <!-- Missing email and invalid email will be shown here: -->
							<div id="missingEmail"></div>
							<div id="validEmail"></div>

              <!-- Message box: -->
              <label for="message">Message: 
							<textarea id="message" name="message" placeholder="Enter message here..."></textarea></label>
              <!-- Empy messagebox error will be shown here: -->
							<div id="noMessage"></div>
              

              <label for="checkbox">Confirm to send: <input id="checkbox" name="checkbox" type="checkbox"></label>
              <!-- No check error will be shown here: -->
							<div id="noCheck"></div>
						</div><button type="submit">Send</button>
					</form>
				</div>
			</section>
			<section class="section3">
				<h3>Follow us!</h3>
				<div class="logoWrapper"><img alt="Instagram" src="assets/igLogo.svg"> <img alt="Facebook" src="assets/fbLogo.svg"> <img alt="LinkedIn" src="assets/linkedinLogo.svg"></div>
			</section>
		</main>
		<aside id="asideLeft"></aside>
		<footer>
			&copy; 2025 Agora
		</footer>
	</div>
	<script src="./js/contact.js" type="module">
	</script> 
</body>
</html>
