<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agora - Contact</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="headerWrapper">
          <h1>Agora</h1>
          <nav>
            <a href="index.html">Home</a>
            <a href="posts.html">Posts</a>
            <a href="contact.html" class="active">Contact</a>
          </nav>
        </div>
      </header>

      <aside id="asideRight"></aside>

      <main>
        <section>
          <div class="formContainer">
            <h3>Contact us</h3>
            <form method="get" name="myForm" id="myForm">
              <div class="nameEmailWrapper">
                <label for="name"
                  >Name:
                  <input
                    type="text"
                    name="name"
                    id="name"
                    placeholder="John Doe"
                  />
                </label>
                <div id="missingName"></div>

                <label for="email"
                  >Email:
                  <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="john.doe@gmail.com"
                  />
                </label>
                <div id="missingEmail"></div>
                <div id="validEmail"></div>

                <label for="checkbox"
                  >Confirm to send:
                  <input type="checkbox" name="checkbox" id="checkbox" />
                </label>
                <div id="noCheck"></div>
              </div>
              <button type="submit">Send</button>
            </form>
          </div>
        </section>

        <section class="section3">
          <h3>Follow us!</h3>
          <div class="logoWrapper">
            <img src="assets/igLogo.svg" alt="Instagram" />
            <img src="assets/fbLogo.svg" alt="Facebook" />
            <img src="assets/linkedinLogo.svg" alt="LinkedIn" />
          </div>
        </section>
      </main>

      <aside id="asideLeft"></aside>

      <footer>&copy; 2025 Agora</footer>
    </div>
  </body>
  <script type="module" src="./contact.js"></script>
</html>
